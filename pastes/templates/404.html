<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paste Not Found</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        .error {
            background: #ffebee;
            padding: 40px;
            border-radius: 8px;
            color: #c62828;
        }
        h1 {
            font-size: 48px;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="error">
        <h1>404</h1>
        <p>This paste is not available. It may have expired or been deleted.</p>
    </div>
</body>
</html>
